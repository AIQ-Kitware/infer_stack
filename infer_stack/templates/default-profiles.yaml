            model: smollm2-135m-instruct
            placement:
              strategy: first_fit
              gpu_count: 1
            publish_port: true
    gateways:
      litellm:
        enabled: false
    frontends:
      open_webui:
        enabled: false
    routes: {}
  workstation-safe:
    description: Single model on the first non-display GPU.
    vllm:
      enable_responses_api_store: false
      logging_level: INFO
    services:
    - service_name: chat
      model: qwen3.5-9b
      placement:
