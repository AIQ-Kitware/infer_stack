# suggestion-pool.yaml — the curated pool of "useful models" the leasing
# controller draws on when it seeds a catalog from server introspection.
#
# This is the intrinsic, *hardware-independent* model registry: each entry
# states facts that are true on any box (footprint, min per-GPU VRAM, preferred
# GPU count, context window, sane vLLM defaults). `infer_stack.leasing.suggest`
# JOINS this pool against the detected GPU inventory to derive a concrete,
# fits-this-server catalog ("seeding is a pure function
# inventory × registry → catalog").
#
# Entries are lifted from the legacy `default-vllm-models.yaml`, spanning the
# current-generation families (Qwen3.5 / Qwen3.6 / Gemma 4 — all real, released
# Feb-Apr 2026) down through the prior-gen instruct workhorses (Qwen2.5, Llama 3,
# Mistral) and a couple of tiny smoke-test models, plus the two SmolLM2/Qwen2.5
# models the leasing demo serves so the demo's set is reproducible. Big entries
# are kept even where they need more than one GPU — the pool is hardware-blind,
# and `suggest` filters per box. served_model_name is normalized to a clean slug
# (the legacy Together-style `org/model-turbo` aliases are dropped).
#
# This file is a *suggestion source*, never a live catalog — nothing here has a
# lifecycle. The legacy `default-vllm-models.yaml` is left untouched as the
# legacy compiler's fixture.

vllm_models:

  # -- tiny: smoke-test / CI models, fit on any GPU ----------------------
  gpt2:
    hf_model_id: openai-community/gpt2
    served_model_name: gpt2
    family: gpt2
    modalities: [text]
    memory_class_gib: 1
    min_vram_gib_per_replica: 1
    preferred_gpu_count: 1
    context_window: 1024
    defaults:
      max_model_len: 1024
      gpu_memory_utilization: 0.3
