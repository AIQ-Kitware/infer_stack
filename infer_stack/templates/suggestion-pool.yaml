  # -- Qwen3.8-27B: measured single-3090 HyperQwen profiles ---------------
  # Qwen/Qwen3.8-27B is a 27.78B-parameter hybrid model with a 262K context
  # window, but its bf16 weights do not fit a 24-GiB card. HyperQwen's measured
  # 3090 path starts from dbirks' ~19.5-GB W4A16 AutoRound body, requantizes the
  # large bf16 heads/MTP module once, adds its fast variant + DFlash2 drafter,
  # and serves through a patched vLLM image. Tuned on RTX 3090 (sm86); also
  # measured unchanged on an RTX PRO 6000 Blackwell (sm120): ~300 tok/s single
  # stream, 4 concurrent batched without queueing, 23 GiB used of 96 because the
  # launcher pins the KV pool. Needs Ampere or newer (the image is CUDA 13).
  # Keep the unsuffixed `qwen3.8-27b` name free for the official
  # Qwen/Qwen3.8-27B checkpoint. This entry is the dbirks W4A16 derivative
  # plus HyperQwen's serving stack, so its catalog identity says so.
  qwen3.8-27b-dbirks-hyperqwen:
    hf_model_id: dbirks/Qwen3.8-27B-W4A16-AutoRound
    served_model_name: qwen3.8-27b-dbirks-hyperqwen
    family: qwen3.8
    modalities: [text]
    memory_class_gib: 20
    min_vram_gib_per_replica: 24
    preferred_gpu_count: 1
    context_window: 262144
    requires_ampere: true
    defaults:
      # HyperQwen's speed-first single-user profile. Its launcher pins the
      # actual KV pool and uses DFlash2; 64K is the measured default, not the
      # model's absolute context ceiling.
      max_model_len: 65536
      gpu_memory_utilization: 0.93
      enable_prefix_caching: true
      image: ghcr.io/syv-ai/hyperqwen:sha-684e927
      # The image's own launcher, not `vllm serve`: its `single` mode reads
      # the settings below from the environment. Keep CTX explicit so the
      # generated catalog describes the whole launch rather than relying on an
      # image-internal default. SPEC=mtp with CTX=long (and a larger
      # max_model_len) is its long-context one. EXTRA_ARGS go last on its
      # vLLM command line, which keeps the served name infer-stack routes to.
      command: [single]
      env:
        PORT: '{port}'
        SPEC: dflash2
        CTX: fast
        PREFIX_CACHE: 1
        MAX_LEN: '{max_model_len}'
        GPU_UTIL: '{gpu_memory_utilization}'
        EXTRA_ARGS: '--served-model-name={served_model_name}'
      # Prepared weights (~20 GB, requantized once) and its compile caches.
      mounts:
        /app/models: hyperqwen/qwen3.8-27b/models
        /cache: hyperqwen/qwen3.8-27b/cache
    # HyperQwen's other context-oriented single-user profiles are useful
    # choices on its reference 24-GiB RTX 3090. These are suggestion variants,
    # not runtime recipes: catalog suggest emits ordinary endpoints referencing
    # this same model, and pins them to the detected 3090 that justified the
    # hardware-specific suggestion. The live catalog stays explicit thereafter.
    endpoint_variants:
      long:
        gpu_name_hints: [rtx 3090]
        runtime:
          max_model_len: 150000
          env:
            SPEC: mtp
            CTX: long
      huge:
        gpu_name_hints: [rtx 3090]
        runtime:
          # HyperQwen's README calls this the ~240K profile; the launcher's
          # measured ceiling with the default 7-token DFlash2 block is 245760.
          max_model_len: 245760
          env:
            SPEC: dflash2
            CTX: huge
