# Merge these models/endpoints into your infer-stack catalog.yaml.
# This is a Compose-managed endpoint, not an external gateway route.
# The 2-GPU repository is only the base image used by this 1-GPU image.
# Pin GPU 1 so GPU 0 remains free. Change to [0] to reverse.
# See docs/qwen38-flash-next-3090.md for staging the checkpoint and preflight.
models:
  qwen38-flash-next-w4a16:
    source: hf://albucino/Qwen3.8-Flash-Next-W4A16-FP8PLE
    revision: ef554143369a706525336f6b42a09094835dc077

endpoints:
  qwen38-flash-next-3090:
    engine: vllm
    model: qwen38-flash-next-w4a16
    served_name: Qwen3.8-Flash-Next
    placement:
      gpu_indices: [1]
      min_vram_gib: 23
      # 125-GB offloaded checkpoint is not a 125-GB GPU allocation.
      weight_floor: false
    runtime:
      image: ghcr.io/dominikbucko/qwen38-flash-next-3090@sha256:7f176605b59c462af21b1b62fd854f9f3cca96e3d11a295581297483d45490a3
      command: [/model]
      tensor_parallel_size: 1
      max_model_len: 135168
      max_num_seqs: 1
      # The image's own launcher reads its profile and environment.
      env:
        PORT: '{port}'
        SERVED_MODEL_NAME: '{served_model_name}'
        MAX_MODEL_LEN: '{max_model_len}'
        QWEN38_HOST_RESERVE_GIB: 16
      mounts:
        /model: qwen38-flash-next-3090/model
        /root/.humming: qwen38-flash-next-3090/humming
        /root/.triton: qwen38-flash-next-3090/triton
      # Mirror the upstream single-3090 Docker launcher requirements.
      compose:
        ipc: host
        cap_add: [SYS_PTRACE]
        ulimits:
          memlock: -1
          stack: 67108864
